title: Glossary
fields:
  -
    handle: table_of_contents_title
    field:
      input_type: text
      antlers: false
      type: text
      display: 'Table of contents title'
      icon: text
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
  -
    handle: sections
    field:
      collapse: true
      previews: true
      fullscreen: true
      sets:
        new_set_group:
          display: 'New Set Group'
          instructions: null
          icon: null
          sets:
            new_section:
              display: 'New Section'
              instructions: null
              icon: content-book-open
              fields:
                -
                  import: glossary_table
      type: replicator
      display: Sections
      icon: replicator
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
