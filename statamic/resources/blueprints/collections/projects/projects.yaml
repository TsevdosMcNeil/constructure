title: Projects
tabs:
  main:
    display: Main
    sections:
      -
        display: Header
        fields:
          -
            handle: title
            field:
              type: textarea
              required: true
              display: Title
              validate:
                - required
              width: 75
          -
            handle: top_title_colour
            field: common.colour
            config:
              display: 'Top Title Colour'
              width: 25
              default: white
          -
            handle: broken_title
            field:
              type: textarea
              display: 'Broken Title'
              width: 75
          -
            handle: subtitle
            field: common.text_rich
            config:
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - color
                - quote
                - anchor
              display: Subtitle
              width: 75
          -
            handle: subtitle_colour
            field: common.colour
            config:
              display: 'Subtitle Background Colour'
              width: 25
      -
        display: 'Page builder'
        fields:
          -
            import: page_builder
  grid:
    display: Grid
    sections:
      -
        display: 'Project Thumbnail'
        instructions: 'Select here the image(s) or video to display in the projects grid.'
        fields:
          -
            handle: hide_in_projects_index
            field:
              type: toggle
              display: 'Hide in projects index'
              instructions: 'Click here to prevent this project from being visible in the project grid.'
              width: 75
          -
            handle: grid_file_type
            field:
              options:
                image: Image
                video: Video
              default: image
              type: button_group
              display: 'Grid File Type'
              width: 25
              validate:
                - required
          -
            handle: grid_image
            field: common.image
            config:
              mode: grid
              listable: true
              display: 'Grid Image'
              width: 66
              folder: projects
              show_set_alt: true
              if:
                grid_file_type: 'equals image'
          -
            handle: grid_orientation
            field: common.orientation
            config:
              options:
                default: Default
                portrait: Portrait
                landscape: Landscape
              default: default
              width: 33
              if:
                grid_file_type: 'equals image'
          -
            handle: grid_hover_image
            field: common.image
            config:
              mode: list
              display: 'Hover Image'
              width: 66
              folder: projects
              if:
                grid_file_type: 'equals image'
          -
            handle: grid_embed_video
            field: video.video_url
            config:
              width: 100
              display: 'Embed Video'
              if:
                grid_file_type: 'equals video'
          -
            handle: grid_caption_hposition
            field:
              options:
                prev: Previous
                below: Below
                next: Next
              default: below
              type: button_group
              display: 'Caption horizontal position'
              width: 50
          -
            handle: grid_caption_vposition
            field:
              options:
                top: Top
                bottom: Bottom
              default: top
              type: button_group
              display: 'Caption Vertical Position'
              width: 50
              if:
                grid_caption_hposition: 'not below'
  seo:
    display: SEO
    sections:
      -
        display: Basic
        instructions: 'Basic SEO settings.'
        fields:
          -
            import: 'statamic-peak-seo::seo_basic'
      -
        display: Advanced
        instructions: 'Advanced SEO settings.'
        fields:
          -
            import: 'statamic-peak-seo::seo_advanced'
      -
        display: 'Open Graph'
        instructions: 'Open Graph meta tags for social sharing.'
        fields:
          -
            import: 'statamic-peak-seo::seo_open_graph'
      -
        display: Sitemap
        instructions: 'Sitemap configuration.'
        fields:
          -
            import: 'statamic-peak-seo::seo_sitemap'
      -
        display: 'JSON-ld Schema'
        instructions: 'Custom JSON-ld schema objects.'
        fields:
          -
            import: 'statamic-peak-seo::seo_jsonld'
  sidebar:
    display: Sidebar
    sections:
      -
        display: Meta
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - required
              display: Slug
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              listable: true
              validate:
                - required
              display: Date
              time_required: false
              earliest_date: '2021-01-01'
          -
            handle: image
            field: common.image
            config:
              mode: grid
              listable: true
              width: 100
              validate:
                - required
          -
            handle: locations
            field:
              type: terms
              taxonomies:
                - locations
              display: Location
              mode: select
              max_items: 1
          -
            handle: location_area
            field:
              type: text
              display: 'Location Area'
          -
            handle: sectors
            field:
              type: terms
              taxonomies:
                - sectors
              display: Sector
              mode: select
              max_items: 1
          -
            handle: expertises
            field:
              type: terms
              taxonomies:
                - expertises
              display: Expertise
              mode: select
              max_items: 1
          -
            handle: project_architect
            field:
              type: text
              display: Arquitect
          -
            handle: project_team
            field:
              type: textarea
              display: Team
          -
            handle: project_mep
            field:
              type: text
              display: MEP
          -
            handle: project_contractor
            field:
              type: text
              display: Contractor
          -
            handle: project_qs
            field:
              type: text
              display: QS
          -
            handle: project_services
            field:
              type: textarea
              display: Services
          -
            handle: project_date
            field:
              type: text
              display: 'Project Date'
          -
            import: related_entry
            prefix: bottom_
