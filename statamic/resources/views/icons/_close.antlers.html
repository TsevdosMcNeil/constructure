#}}

<!-- /icons/_close.antlers.html -->

<svg viewBox="0 0 55 55" 
    xmlns="http://www.w3.org/2000/svg"
    class="group
        ease-in duration-300
        {{ svg_class ? svg_class : 'w-[55px] fill-none' }}

>

        cy="27.5"
        r="27.5" 
        class="{{ circle_class ? circle_class : 'fill-white' }}"
    />

        y1="38.8198" 
        x2="17.6066" 
        y2="17.6066" 
        class="{{ line_class ? line_class : 'stroke-2 stroke-blue' }}"
    />
    <line x1="17.6066"

        y2="17.6066"
