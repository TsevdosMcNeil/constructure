{{#
    @name Arrow button
    @desc An arrow button that can be used for navigation links.
#}}

<!-- /icons/_arrow.antlers.html -->

<svg xmlns="http://www.w3.org/2000/svg"
    width="{{ svg_size }}" 
    height="{{ svg_size }}" 
    viewBox="0 0 55 55" 
    class="transition-all 
        rounded-full 
        {{ svg_class }}
    "
>
    <circle cx="27.5" 
        cy="27.5" 
        r="26.5" 
        transform="rotate(-180 27.5 27.5)" 
        class="stroke-2 
            {{ circle_class }}
        "
    />
    <path d="M43 20L27 36L11 20" 
        class="stroke-2 
            {{ path_class }}
        "
    />
</svg>

<!-- End /icons/_arrow.antlers.html -->
