
{{#
    @name Filter element
    @desc A li element for the filter list.
    @param slug            Slug of the filter item
    @param title           Title of the filter item
    @param tax             Taxonomy of the filter item
#}}

<li id="filter-{{ tax }}-{{ slug }}"
    role="button"
    tabindex="0"
    class="cursor-pointer hover:text-blue"
    x-bind:class="isSelected('{{ tax }}', '{{ slug }}') ? 'text-blue' : 'text-primary'"
    x-bind:aria-pressed="isSelected('{{ tax }}', '{{ slug }}') ? 'true' : 'false'"
    @click="toggle_filter('{{ tax }}', '{{ slug }}')"
    @keydown.enter.prevent="toggle_filter('{{ tax }}', '{{ slug }}')"
>{{ title }}</li>
